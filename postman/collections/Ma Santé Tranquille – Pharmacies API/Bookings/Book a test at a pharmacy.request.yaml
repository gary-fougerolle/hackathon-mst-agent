$kind: http-request
description: >
  Books a slot for a service. Call it **only after the patient explicitly
  confirms**

  (`patient_confirmed: true`). The patient is identified by an opaque token:

  no identity travels in clear.
url: "{{baseUrl}}/pharmacies/:pharmacy_id/bookings"
method: POST
headers:
  Content-Type: application/json
  Accept: application/json
pathVariables:
  - key: pharmacy_id
    value: ph-69003-01
    description: ID returned by the search.
body:
  type: json
  content: |-
    {
      "service": "rapid_antigen_test",
      "slot": "2026-11-04T10:15:00+01:00",
      "patient_token": "tok_pat_7f3a91",
      "patient_confirmed": true
    }
examples: ./.resources/Book a test at a pharmacy.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      const onMock = (pm.variables.get('baseUrl') || '').includes('mock.pstmn.io');

      if (onMock) {
        pm.test('Mock replies with a saved example', () => pm.expect(pm.response.code).to.be.oneOf([201, 409, 428]));
      } else {
        pm.test('Booking with patient confirmation returns 201', () => pm.response.to.have.status(201));
        pm.test('Booking is confirmed', () => pm.expect(pm.response.json().status).to.eql('confirmed'));
        pm.sendRequest({ url: pm.variables.replaceIn('{{baseUrl}}/pharmacies/ph-69003-01/bookings'), method: 'POST', header: { 'Content-Type': 'application/json' }, body: { mode: 'raw', raw: JSON.stringify({ service: 'rapid_antigen_test', patient_token: 'tok_pat_7f3a91' }) } }, (err, res) => {
          pm.test('Booking without patient confirmation returns 428', () => {
            pm.expect(err).to.be.null;
            pm.expect(res.code).to.eql(428);
            pm.expect(res.json().code).to.eql('confirmation_required');
          });
        });
      }
