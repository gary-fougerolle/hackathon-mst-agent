$kind: http-request
description: Returns the on-duty pharmacy for the area and how to access it
  (call first, night window).
url: "{{baseUrl}}/pharmacies/on-duty?postal_code=69003"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: postal_code
    value: "69003"
    description: French 5-digit postal code.
examples: ./.resources/Nearest on-duty pharmacy.resources/examples
order: 2000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Gives the on-duty pharmacy and how to access it', () => {
        pm.expect(body.pharmacy_id).to.be.a('string').and.not.empty;
        pm.expect(body.access_conditions).to.be.a('string').and.not.empty;
      });
