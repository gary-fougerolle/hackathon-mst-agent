$kind: http-request
description: Lists practitioners around a postal code, with their next available slot.
url: "{{baseUrl}}/practitioners?postal_code=69003&specialty=general_practitione\
  r&mode=video"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: postal_code
    value: "69003"
    description: French 5-digit postal code.
  - key: specialty
    value: general_practitioner
    description: Requested specialty.
  - key: mode
    value: video
    description: In-person or video consultation.
examples: ./.resources/Nearby available practitioners.resources/examples
order: 1000
scripts:
  - type: afterResponse
    language: text/javascript
    code: |-
      pm.test('Status is 200', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('Returns practitioners with their modes', () => {
        pm.expect(body.results).to.be.an('array').that.is.not.empty;
        body.results.forEach((p) => pm.expect(p.modes).to.be.an('array').that.is.not.empty);
      });
