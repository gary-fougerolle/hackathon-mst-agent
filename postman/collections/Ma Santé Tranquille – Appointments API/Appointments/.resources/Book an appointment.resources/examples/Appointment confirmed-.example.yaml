$kind: http-example
name: Appointment confirmed.
request:
  url: "{{baseUrl}}/appointments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-Api-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "practitioner_id": "prac-001",
        "slot_id": "sl-001-1430",
        "reason_summary": "Fever and cough for 2 days",
        "patient_token": "tok_pat_7f3a91",
        "ssn_token": "tok_ssn_c41e07",
        "patient_confirmed": true
      }
response:
  statusCode: 201
  statusText: Created
  headers:
    Content-Type: application/json
  body:
    type: json
    content: |-
      {
        "appointment_id": "apt-000732",
        "status": "confirmed",
        "practitioner": "Dr Claire Martin",
        "start": "2026-11-04T14:30:00+01:00",
        "mode": "in_person",
        "address": "18 rue Paul Bert, 69003 Lyon",
        "trace_id": "trc-5d1b2c"
      }
order: 1000
