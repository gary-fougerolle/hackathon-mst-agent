$kind: http-example
name: Sensitive data sent in clear.
request:
  url: "{{baseUrl}}/appointments"
  method: POST
  headers:
    - key: Content-Type
      value: application/json
    - key: Accept
      value: application/json
    - key: X-Api-Key
      value: <API Key>
      description: "Added as a part of security scheme: apikey"
  body:
    type: json
    content: |-
      {
        "practitioner_id": "prac-001",
        "slot_id": "sl-001-1430",
        "reason_summary": "Fever and cough for 2 days",
        "patient_token": "tok_pat_7f3a91",
        "ssn_token": "tok_ssn_c41e07",
        "patient_confirmed": true
      }
response:
  statusCode: 422
  statusText: Unprocessable Entity (WebDAV) (RFC 4918)
  headers:
    Content-Type: application/json
  body:
    type: json
    content: >-
      {
        "code": "sensitive_data_rejected",
        "message": "A social security number was detected in clear. Use ssn_token."
      }
order: 3000
