name: deploy-and-test

# Deploys the Ma Santé Tranquille demo APIs (infra/) to AWS, runs the Postman
# collections against them, lints the specs (both reported to the API Catalog),
# and records a deployment marker in New Relic.
#
# Required:
#   - AWS role mst-github-deploy (infra/github-oidc.tf), assumed through OIDC: no AWS keys stored here.
#   - Secret POSTMAN_API_KEY (Field Services v12 team), for the spec lints and collection runs.
# Optional (the New Relic step is skipped without them):
#   - Secret NEW_RELIC_API_KEY (User API key) and variable NEW_RELIC_ENTITY_GUID.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/**", "specs/**", "postman/**", ".github/workflows/deploy-and-test.yml"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::005904641462:role/mst-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.out.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - id: out
        working-directory: infra
        run: echo "base_url=$(terraform output -raw base_url)" >> "$GITHUB_OUTPUT"

  test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Log in to Postman
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: postman login --with-api-key "$POSTMAN_API_KEY"

      - name: Lint the API specs (reported to the API Catalog)
        # Spec IDs in the workspace "[Gary] Ma Santé Tranquille – Hackathon Médecins Sans Tokens".
        run: |
          postman spec lint 7ce2b915-06fe-4c63-b804-b9db805fef82 --report-events
          postman spec lint cafacd7d-f279-4cae-bdd1-b01d115de642 --report-events
          postman spec lint c1693eef-b058-4706-9b31-fd88d0aa73bf --report-events

      - name: Run the collections against AWS (reported to the API Catalog)
        # Runs the Git-native collections from postman/ with the AWS environments,
        # which are linked to the "MST Hackathon (AWS)" system environment.
        run: |
          for api in "Health Surveillance" "Pharmacies" "Appointments"; do
            postman collection run "postman/collections/Ma Santé Tranquille – $api API" \
              -e "postman/environments/Ma Santé Tranquille – $api – AWS.environment.yaml" \
              --report-events
          done

  new-relic-marker:
    needs: test
    runs-on: ubuntu-latest
    env:
      NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
    steps:
      - name: Record the deployment in New Relic
        if: ${{ env.NEW_RELIC_API_KEY != '' && vars.NEW_RELIC_ENTITY_GUID != '' }}
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          guid: ${{ vars.NEW_RELIC_ENTITY_GUID }}
          version: ${{ github.sha }}
          user: ${{ github.actor }}
          description: "Ma Santé Tranquille demo APIs deployed from ${{ github.ref_name }}"
