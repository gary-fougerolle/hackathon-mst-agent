name: deploy-and-test

# Deploys the Ma Santé Tranquille demo APIs (infra/) to AWS, runs the Postman
# collections against them, and records a deployment marker in New Relic.
#
# Required:
#   - AWS role mst-github-deploy (infra/github-oidc.tf), assumed through OIDC: no AWS keys stored here.
#   - Secret POSTMAN_API_KEY (Field Services v12 team), for the collection runs.
# Optional (the New Relic step is skipped without them):
#   - Secret NEW_RELIC_API_KEY (User API key) and variable NEW_RELIC_ENTITY_GUID.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["infra/**", "specs/**", ".github/workflows/deploy-and-test.yml"]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  AWS_ROLE_ARN: arn:aws:iam::005904641462:role/mst-github-deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.out.outputs.base_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Terraform apply
        working-directory: infra
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve

      - id: out
        working-directory: infra
        run: echo "base_url=$(terraform output -raw base_url)" >> "$GITHUB_OUTPUT"

  test:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: Install Postman CLI
        run: curl -o- "https://dl-cli.pstmn.io/install/linux64.sh" | sh

      - name: Run the collections against AWS
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          postman login --with-api-key "$POSTMAN_API_KEY"
          # Collection and environment UIDs from the workspace
          # "[Gary] Ma Santé Tranquille – Hackathon Médecins Sans Tokens".
          postman collection run 56012510-9fe6c9f0-ef58-4127-96d1-9705e9958358 -e 56012510-7f2e7c75-de2c-479d-9f0f-3479dc6365ae
          postman collection run 56012510-1b23feb7-d3f9-41a9-81e7-309a6a950c1b -e 56012510-00e61c0c-cafa-4f1e-8947-50f0be4af051
          postman collection run 56012510-b925173f-dfe6-4d4f-985d-6191c526a5a7 -e 56012510-de5820f4-931b-4134-946e-4bc00d5511ec

  new-relic-marker:
    needs: test
    runs-on: ubuntu-latest
    env:
      NEW_RELIC_API_KEY: ${{ secrets.NEW_RELIC_API_KEY }}
    steps:
      - name: Record the deployment in New Relic
        if: ${{ env.NEW_RELIC_API_KEY != '' && vars.NEW_RELIC_ENTITY_GUID != '' }}
        uses: newrelic/deployment-marker-action@v2.6.2
        with:
          apiKey: ${{ secrets.NEW_RELIC_API_KEY }}
          guid: ${{ vars.NEW_RELIC_ENTITY_GUID }}
          version: ${{ github.sha }}
          user: ${{ github.actor }}
          description: "Ma Santé Tranquille demo APIs deployed from ${{ github.ref_name }}"
